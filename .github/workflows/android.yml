name: Build Android app (.apk)

# Builds a self-contained, installable Android app from the repo — no Android
# Studio needed on your machine. The .apk is attached to the run as a download.
#
# How to use:
#   1. Go to the repo's "Actions" tab on GitHub.
#   2. Pick "Build Android app (.apk)" → "Run workflow" → Run.
#   3. When it finishes (green check), open the run and download the
#      "dawnhalo-android-apk" artifact. Unzip it to get app-debug.apk.
#   4. Copy that .apk to your Android phone and tap it to install
#      (enable "install from unknown sources" if prompted).
#
# It also runs automatically on every push to main.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL (leave empty for offline mode)"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "server/**"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Java (JDK 17 — required by Capacitor/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK; the setup-android
      # action only wrapped it, and kept failing. Use it directly and install
      # exactly what Capacitor 6 asks for (compileSdk 34).
      - name: Set up Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "sdk=$SDK"
          ls "$SDK" || true
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install

      - name: Build web app (SPA)
        run: bun run build
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url || vars.VITE_API_URL || '' }}

      - name: Prepare bundled web folder
        run: bun run cap:web

      - name: Add Android platform
        run: bun run cap:add:android

      # Google Play wants new apps on API 35. Capacitor 6's template still says
      # 34, so the generated project is nudged up here. Android 15 also forces
      # edge-to-edge on apps that target it and Capacitor 6 does not draw under
      # the system bars, so the activity opts out — allowed for targetSdk 35.
      - name: Target Android 15 (API 35)
        run: |
          set -e
          sed -i 's/compileSdkVersion = 34/compileSdkVersion = 35/; s/targetSdkVersion = 34/targetSdkVersion = 35/' android/variables.gradle
          grep -E 'compileSdkVersion|targetSdkVersion' android/variables.gradle
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q windowOptOutEdgeToEdgeEnforcement "$M"; then
            sed -i '0,/<activity/s//<activity\n            android:windowOptOutEdgeToEdgeEnforcement="true"/' "$M"
          fi
          grep -n 'windowOptOutEdgeToEdgeEnforcement' "$M"

      - name: Generate app icons & splash from the DawnHalo logo
        run: bunx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#0e0a14' --iconBackgroundColorDark '#0e0a14' --splashBackgroundColor '#0e0a14' --splashBackgroundColorDark '#0e0a14'

      - name: Sync web assets into Android project
        run: bun run cap:sync

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Say what broke, in a form that survives outside the log viewer
        if: failure()
        run: |
          if [ -f /tmp/build.log ]; then
            tail -n 40 /tmp/build.log | sed 's/%/%%/g' | while IFS= read -r l; do
              [ -n "$l" ] && echo "::error::$l"
            done
          else
            echo "::error::failed before the gradle build started"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dawnhalo-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Attach it to a release as well: run artifacts are zipped and live behind
      # a storage host that not every client can reach, while a release asset is
      # a plain download anyone can fetch.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Dawnhalo APK #${{ github.run_number }}" \
            --notes "Debug build of ${{ github.sha }}." \
            --latest
