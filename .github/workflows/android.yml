name: Build Android app (.apk)

# Builds a self-contained, installable Android app from the repo — no Android
# Studio needed on your machine. The .apk is attached to the run as a download.
#
# How to use:
#   1. Go to the repo's "Actions" tab on GitHub.
#   2. Pick "Build Android app (.apk)" → "Run workflow" → Run.
#   3. When it finishes (green check), open the run and download the
#      "dawnhalo-android-apk" artifact. Unzip it to get app-debug.apk.
#   4. Copy that .apk to your Android phone and tap it to install
#      (enable "install from unknown sources" if prompted).
#
# It also runs automatically on every push to main.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL (leave empty for offline mode)"
        required: false
        default: ""
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "server/**"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach the .apk to a prerelease
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Java (JDK 17 — required by Capacitor/Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install

      - name: Build web app (SPA)
        run: bun run build
        env:
          VITE_API_URL: ${{ github.event.inputs.api_url || vars.VITE_API_URL || '' }}

      - name: Prepare bundled web folder
        run: bun run cap:web

      - name: Add Android platform
        run: bun run cap:add:android

      - name: Generate app icons & splash from the DawnHalo logo
        run: bunx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#fdfcfb' --iconBackgroundColorDark '#fdfcfb' --splashBackgroundColor '#fdfcfb' --splashBackgroundColorDark '#180a14'

      - name: Sync web assets into Android project
        run: bun run cap:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dawnhalo-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Artifact downloads require a desktop GitHub login, which makes them
      # useless to someone driving this project from a phone. Release assets
      # download with a plain tap, so every hand-run build also lands on a
      # prerelease.
      - name: Attach the APK to a prerelease
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          API_URL: ${{ github.event.inputs.api_url }}
        run: |
          set -euo pipefail
          tag="apk-$(date -u +%Y%m%d-%H%M)"
          {
            echo "Debug APK built from \`$BRANCH\` (\`${GITHUB_SHA:0:7}\`)."
            echo
            echo "Backend: \`${API_URL:-offline}\`"
            echo
            echo "Open this page on your phone and tap \`app-debug.apk\` to install."
          } > release-notes.md
          gh release create "$tag" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --prerelease \
            --title "Dawnhalo test build $tag" \
            --notes-file release-notes.md
          url="$(gh release view "$tag" --json url -q .url)"
          echo "### 📱 Install on your phone" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
