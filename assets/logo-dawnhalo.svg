<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Dawnhalo logo (design B): sun cradled by a crescent halo on warm cream,
       with the wordmark beneath. Keep in sync with public/app-icon.svg. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfcfb"/>
      <stop offset="60%" stop-color="#fcf4eb"/>
      <stop offset="100%" stop-color="#fae9dd"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="50%" stop-color="#fa7454"/>
      <stop offset="100%" stop-color="#d84264"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe29e"/>
      <stop offset="50%" stop-color="#ffa454"/>
      <stop offset="100%" stop-color="#f36a5c"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Mark, scaled 0.82 and raised to leave room for the wordmark -->
  <g transform="translate(512 430) scale(0.82) translate(-512 -500)">
    <path fill="url(#ring)" fill-rule="evenodd"
          d="M512 190a310 310 0 1 0 .1 0Z M512 210a238 238 0 1 1-.1 0Z"/>
    <circle cx="512" cy="615" r="150" fill="url(#sun)"/>
  </g>

  <!-- Wordmark -->
  <text x="512" y="855"
        font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="120"
        font-style="italic"
        font-weight="300"
        letter-spacing="6"
        fill="#2d2a2e"
        text-anchor="middle">
    Dawnhalo
  </text>
</svg>
